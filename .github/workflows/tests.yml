name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            laravel: '^8.65'
            testbench: '^6.23'
            phpunit: '^9.6'
          - php: '8.0'
            laravel: '^8.65'
            testbench: '^6.23'
            phpunit: '^9.6'
          - php: '8.0'
            laravel: '^9.0'
            testbench: '^7.0'
            phpunit: '^9.6'
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
            phpunit: '^10.5'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: >-
          composer update --prefer-dist --no-interaction --no-progress --no-blocking
          --with laravel/framework:${{ matrix.laravel }}
          --with orchestra/testbench:${{ matrix.testbench }}
          --with phpunit/phpunit:${{ matrix.phpunit }}
      - run: composer test

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer phpstan
